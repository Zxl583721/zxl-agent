services:
  mysql:
    image: mysql:8.4
    container_name: zxl-agent-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: zxl_agent
      MYSQL_USER: zxl_agent
      MYSQL_PASSWORD: zxl_agent
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: zxl-agent-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: zxl-agent-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: &app-env
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: zxl_agent
      MYSQL_PASSWORD: zxl_agent
      MYSQL_DATABASE: zxl_agent
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      DEFAULT_USER_ID: 1
      DEFAULT_KNOWLEDGE_BASE_ID: 1
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
      LLM_MODEL: ${LLM_MODEL:-qwen3:8b}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://host.docker.internal:11434}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      ZHIPUAI_API_KEY: ${ZHIPUAI_API_KEY:-}
    command: sh -c "python scripts/init_db.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./vector_store:/app/vector_store
      - ./conversation_store.sqlite3:/app/conversation_store.sqlite3

  celery_worker:
    build: .
    container_name: zxl-agent-celery-worker
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *app-env
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=1
    volumes:
      - ./data:/app/data
      - ./vector_store:/app/vector_store
      - ./conversation_store.sqlite3:/app/conversation_store.sqlite3

volumes:
  mysql_data:
  redis_data:

