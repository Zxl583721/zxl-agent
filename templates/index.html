<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RAG Agent</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8fa;
      --panel: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #d7dde5;
      --accent: #2563eb;
      --ok: #0f766e;
      --warn: #b45309;
      --danger: #b91c1c;
      --user: #e9f1ff;
      --agent: #f3f4f6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input, textarea, select { font: inherit; }
    button {
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--text);
      cursor: pointer;
      font-weight: 700;
    }
    button.primary { border-color: var(--accent); background: var(--accent); color: #fff; }
    button:disabled { cursor: not-allowed; opacity: .6; }
    input, textarea, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--text);
    }
    input, select { height: 38px; padding: 0 10px; }
    textarea { min-height: 72px; padding: 10px; resize: vertical; line-height: 1.55; }
    .app { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: 100vh; }
    .sidebar { border-right: 1px solid var(--line); background: #eef2f7; padding: 22px; }
    .brand { margin: 0 0 18px; font-size: 24px; line-height: 1.2; }
    .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 14px;
      margin-bottom: 16px;
    }
    .panel h2 { margin: 0 0 10px; font-size: 15px; }
    .stack { display: grid; gap: 10px; }
    .muted { color: var(--muted); }
    .small { font-size: 13px; line-height: 1.5; }
    .status.ready { color: var(--ok); }
    .status.pending { color: var(--warn); }
    .status.error { color: var(--danger); }
    .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .tabs button.active { border-color: var(--accent); color: var(--accent); }
    .main { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-width: 0; height: 100vh; }
    .topbar { border-bottom: 1px solid var(--line); background: var(--panel); padding: 18px 24px; }
    .topbar h1 { margin: 0; font-size: 20px; }
    .topbar p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
    .messages { overflow-y: auto; padding: 24px; }
    .message {
      max-width: 860px;
      margin-bottom: 14px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      line-height: 1.65;
      overflow-wrap: anywhere;
    }
    .message.user { margin-left: auto; background: var(--user); white-space: pre-wrap; }
    .message.agent { background: var(--agent); }
    .message.markdown p { margin: 0 0 10px; }
    .sources { margin-top: 12px; display: grid; gap: 8px; }
    .source { border-top: 1px solid var(--line); padding-top: 8px; color: var(--muted); font-size: 13px; }
    .composer { border-top: 1px solid var(--line); background: var(--panel); padding: 16px 24px; }
    .composer form { display: grid; grid-template-columns: minmax(0, 1fr) 130px 82px; gap: 10px; align-items: end; }
    .document-list { display: grid; gap: 8px; max-height: 260px; overflow-y: auto; }
    .document-item { border-top: 1px solid var(--line); padding-top: 8px; }
    .document-name { margin: 0 0 4px; font-size: 13px; overflow-wrap: anywhere; }
    .document-meta { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.45; }
    .hidden { display: none !important; }
    @media (max-width: 860px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { border-right: 0; border-bottom: 1px solid var(--line); }
      .main { height: auto; min-height: 70vh; }
      .composer form { grid-template-columns: 1fr; }
    }
  </style>
  <script defer src="/static/vendor/purify.min.js"></script>
  <script defer src="/static/vendor/marked.umd.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <h1 class="brand">RAG Agent</h1>

      <section class="panel" id="authPanel">
        <div class="tabs">
          <button type="button" class="active" id="loginTab">登录</button>
          <button type="button" id="registerTab">注册</button>
        </div>
        <form class="stack" id="authForm" style="margin-top: 12px;">
          <input id="username" autocomplete="username" placeholder="用户名">
          <input id="password" autocomplete="current-password" type="password" placeholder="密码">
          <input id="email" class="hidden" autocomplete="email" type="email" placeholder="邮箱，可选">
          <button class="primary" id="authButton" type="submit">登录</button>
          <p class="small muted" id="authMessage">请先登录后使用知识库。</p>
        </form>
      </section>

      <section class="panel hidden" id="userPanel">
        <h2>当前用户</h2>
        <p class="small" id="currentUser">未登录</p>
        <button type="button" id="logoutButton">退出登录</button>
      </section>

      <section class="panel">
        <h2>服务状态</h2>
        <p class="small status pending" id="statusText">等待登录后检查。</p>
      </section>

      <section class="panel hidden" id="uploadPanel">
        <h2>上传文档</h2>
        <form class="stack" id="uploadForm">
          <input id="knowledgeBaseId" type="number" min="1" placeholder="知识库 ID，默认自动创建">
          <input id="fileInput" type="file" multiple accept=".txt,.pdf,.docx,.pptx">
          <button class="primary" id="uploadButton" type="submit">上传入库</button>
          <p class="small muted" id="uploadMessage">支持 txt、pdf、docx、pptx。</p>
        </form>
      </section>

      <section class="panel hidden" id="documentsPanel">
        <h2>文档列表</h2>
        <div class="stack">
          <button type="button" id="refreshDocumentsButton">刷新文档</button>
          <div class="document-list" id="documentList">
            <p class="small muted">暂无文档。</p>
          </div>
        </div>
      </section>
    </aside>

    <main class="main">
      <header class="topbar">
        <h1>知识库问答</h1>
        <p>登录后上传自己的资料，并在隔离的知识库中发起问答。</p>
      </header>
      <section class="messages" id="messages">
        <div class="message agent">请先登录或注册账号。</div>
      </section>
      <section class="composer">
        <form id="chatForm">
          <textarea id="questionInput" placeholder="输入问题，按 Enter 发送，Shift + Enter 换行"></textarea>
          <select id="modeInput">
            <option value="knowledge" selected>知识库问答</option>
            <option value="general">通用聊天</option>
          </select>
          <button class="primary" id="sendButton" type="submit">发送</button>
        </form>
      </section>
    </main>
  </div>

  <script>
    const tokenKey = "zxl-agent-access-token";
    const conversationStorageKey = "zxl-agent-conversation-id";
    let token = window.sessionStorage.getItem(tokenKey) || "";
    let conversationId = window.localStorage.getItem(conversationStorageKey) || "";
    let authMode = "login";

    const authPanel = document.querySelector("#authPanel");
    const userPanel = document.querySelector("#userPanel");
    const uploadPanel = document.querySelector("#uploadPanel");
    const documentsPanel = document.querySelector("#documentsPanel");
    const loginTab = document.querySelector("#loginTab");
    const registerTab = document.querySelector("#registerTab");
    const authForm = document.querySelector("#authForm");
    const authButton = document.querySelector("#authButton");
    const authMessage = document.querySelector("#authMessage");
    const usernameInput = document.querySelector("#username");
    const passwordInput = document.querySelector("#password");
    const emailInput = document.querySelector("#email");
    const currentUser = document.querySelector("#currentUser");
    const logoutButton = document.querySelector("#logoutButton");
    const statusText = document.querySelector("#statusText");
    const messages = document.querySelector("#messages");
    const chatForm = document.querySelector("#chatForm");
    const questionInput = document.querySelector("#questionInput");
    const modeInput = document.querySelector("#modeInput");
    const sendButton = document.querySelector("#sendButton");
    const uploadForm = document.querySelector("#uploadForm");
    const uploadButton = document.querySelector("#uploadButton");
    const uploadMessage = document.querySelector("#uploadMessage");
    const fileInput = document.querySelector("#fileInput");
    const knowledgeBaseIdInput = document.querySelector("#knowledgeBaseId");
    const refreshDocumentsButton = document.querySelector("#refreshDocumentsButton");
    const documentList = document.querySelector("#documentList");

    function authHeaders(extra = {}) {
      return token ? { ...extra, Authorization: `Bearer ${token}` } : extra;
    }

    async function apiFetch(url, options = {}) {
      const response = await fetch(url, {
        ...options,
        headers: authHeaders(options.headers || {}),
      });
      if (response.status === 401) {
        clearToken();
        throw new Error("请重新登录。");
      }
      return response;
    }

    function setAuthMode(nextMode) {
      authMode = nextMode;
      const isRegister = authMode === "register";
      loginTab.classList.toggle("active", !isRegister);
      registerTab.classList.toggle("active", isRegister);
      emailInput.classList.toggle("hidden", !isRegister);
      authButton.textContent = isRegister ? "注册" : "登录";
      authMessage.textContent = isRegister ? "注册后会自动登录。" : "请先登录后使用知识库。";
    }

    function setToken(nextToken) {
      token = nextToken;
      window.sessionStorage.setItem(tokenKey, token);
    }

    function clearToken() {
      token = "";
      window.sessionStorage.removeItem(tokenKey);
      authPanel.classList.remove("hidden");
      userPanel.classList.add("hidden");
      uploadPanel.classList.add("hidden");
      documentsPanel.classList.add("hidden");
      messages.innerHTML = '<div class="message agent">请先登录或注册账号。</div>';
      statusText.textContent = "等待登录后检查。";
      statusText.className = "small status pending";
    }

    function renderLoggedIn(user) {
      authPanel.classList.add("hidden");
      userPanel.classList.remove("hidden");
      uploadPanel.classList.remove("hidden");
      documentsPanel.classList.remove("hidden");
      currentUser.textContent = `${user.display_name || user.username}（ID ${user.id}）`;
    }

    function appendMessage(role, text) {
      const node = document.createElement("div");
      node.className = `message ${role}`;
      if (role === "agent") {
        renderMarkdownMessage(node, text);
      } else {
        node.textContent = text;
      }
      messages.appendChild(node);
      messages.scrollTop = messages.scrollHeight;
      return node;
    }

    function renderMarkdownMessage(node, text) {
      if (!window.marked || !window.DOMPurify) {
        node.textContent = text;
        return;
      }
      node.classList.add("markdown");
      const html = window.marked.parse(text || "", { breaks: true, gfm: true });
      node.innerHTML = window.DOMPurify.sanitize(html);
    }

    function renderSources(node, sources) {
      if (!sources || sources.length === 0) {
        return;
      }
      const sourcesNode = document.createElement("div");
      sourcesNode.className = "sources";
      for (const source of sources) {
        const item = document.createElement("div");
        item.className = "source";
        const name = source.source || "未命名文档";
        const page = source.page_range || source.start_page || "";
        const chapter = source.chapter ? `章节：${source.chapter}` : "";
        const pageText = page ? `页码：${page}` : "";
        item.textContent = [name, chapter, pageText].filter(Boolean).join("，");
        sourcesNode.appendChild(item);
      }
      node.appendChild(sourcesNode);
    }

    async function loadMe() {
      if (!token) {
        clearToken();
        return;
      }
      try {
        const response = await apiFetch("/api/auth/me");
        const user = await response.json();
        renderLoggedIn(user);
        await loadStatus();
        await loadDocuments();
      } catch (error) {
        clearToken();
      }
    }

    async function loadStatus() {
      try {
        const response = await fetch("/health");
        const data = await response.json();
        statusText.textContent = `状态：${data.status}，MySQL ${data.services.mysql}，Redis ${data.services.redis}，Chroma ${data.services.chroma}，Celery ${data.services.celery}`;
        statusText.className = data.status === "ok" ? "small status ready" : "small status pending";
      } catch (error) {
        statusText.textContent = "状态读取失败。";
        statusText.className = "small status error";
      }
    }

    async function loadDocuments() {
      if (!token) return;
      const kb = knowledgeBaseIdInput.value ? `&knowledge_base_id=${encodeURIComponent(knowledgeBaseIdInput.value)}` : "";
      try {
        const response = await apiFetch(`/api/knowledge/documents?page=1&page_size=20${kb}`);
        const data = await response.json();
        documentList.innerHTML = "";
        if (!data.items || data.items.length === 0) {
          documentList.innerHTML = '<p class="small muted">暂无文档。</p>';
          return;
        }
        for (const documentItem of data.items) {
          const item = document.createElement("div");
          item.className = "document-item";
          item.innerHTML = `
            <p class="document-name"></p>
            <p class="document-meta"></p>
          `;
          item.querySelector(".document-name").textContent = documentItem.filename;
          item.querySelector(".document-meta").textContent = `状态：${documentItem.status}，分块：${documentItem.chunk_count}，hash：${documentItem.hash}`;
          documentList.appendChild(item);
        }
      } catch (error) {
        documentList.innerHTML = '<p class="small muted">读取文档失败。</p>';
      }
    }

    authForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const username = usernameInput.value.trim();
      const password = passwordInput.value;
      if (!username || !password) {
        authMessage.textContent = "请输入用户名和密码。";
        return;
      }
      const payload = { username, password };
      if (authMode === "register" && emailInput.value.trim()) {
        payload.email = emailInput.value.trim();
      }
      authButton.disabled = true;
      try {
        const response = await fetch(authMode === "register" ? "/api/auth/register" : "/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.detail || "认证失败。");
        }
        setToken(data.access_token);
        renderLoggedIn(data.user);
        messages.innerHTML = '<div class="message agent">已登录，可以开始提问。</div>';
        await loadStatus();
        await loadDocuments();
      } catch (error) {
        authMessage.textContent = error.message;
      } finally {
        authButton.disabled = false;
      }
    });

    chatForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const question = questionInput.value.trim();
      if (!question || !token) return;

      appendMessage("user", question);
      questionInput.value = "";
      sendButton.disabled = true;
      sendButton.textContent = "生成中";

      try {
        const agentNode = appendMessage("agent", "");
        const payload = {
          conversation_id: conversationId || null,
          question,
          mode: modeInput.value,
        };
        if (knowledgeBaseIdInput.value) {
          payload.knowledge_base_id = Number(knowledgeBaseIdInput.value);
        }
        const response = await apiFetch("/api/chat/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        if (!response.ok || !response.body) {
          throw new Error("请求失败。");
        }

        let answer = "";
        let streamBuffer = "";
        let streamedSources = [];
        const decoder = new TextDecoder();
        const reader = response.body.getReader();
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          streamBuffer += decoder.decode(value, { stream: true });
          const events = streamBuffer.split("\n\n");
          streamBuffer = events.pop() || "";
          for (const rawEvent of events) {
            const parsedEvent = parseSseEvent(rawEvent);
            if (!parsedEvent) continue;
            if (parsedEvent.data.conversation_id) {
              conversationId = parsedEvent.data.conversation_id;
              window.localStorage.setItem(conversationStorageKey, conversationId);
            }
            if (parsedEvent.event === "metadata") {
              streamedSources = parsedEvent.data.sources || streamedSources;
            } else if (parsedEvent.event === "token") {
              answer += parsedEvent.data.content || "";
              renderMarkdownMessage(agentNode, answer);
              messages.scrollTop = messages.scrollHeight;
            } else if (parsedEvent.event === "error") {
              throw new Error(parsedEvent.data.message || "生成失败。");
            }
          }
        }
        renderSources(agentNode, streamedSources);
      } catch (error) {
        appendMessage("agent", error.message || "请求失败。");
      } finally {
        sendButton.disabled = false;
        sendButton.textContent = "发送";
        questionInput.focus();
      }
    });

    uploadForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!fileInput.files.length || !token) {
        uploadMessage.textContent = "请选择要上传的文件。";
        return;
      }
      const formData = new FormData();
      Array.from(fileInput.files).forEach((file) => formData.append("files", file));
      const query = knowledgeBaseIdInput.value ? `?knowledge_base_id=${encodeURIComponent(knowledgeBaseIdInput.value)}` : "";
      uploadButton.disabled = true;
      uploadMessage.textContent = "正在上传并投递索引任务。";
      try {
        const response = await apiFetch(`/api/knowledge/upload${query}`, {
          method: "POST",
          body: formData,
        });
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.detail?.message || "上传失败。");
        }
        if (!knowledgeBaseIdInput.value && data.knowledge_base_id) {
          knowledgeBaseIdInput.value = data.knowledge_base_id;
        }
        uploadMessage.textContent = `${data.message} task_ids: ${(data.task_ids || []).join(", ")}`;
        fileInput.value = "";
        await loadDocuments();
      } catch (error) {
        uploadMessage.textContent = error.message || "上传失败。";
      } finally {
        uploadButton.disabled = false;
      }
    });

    function parseSseEvent(rawEvent) {
      const lines = rawEvent.split("\n");
      const eventLine = lines.find((line) => line.startsWith("event:"));
      const dataLines = lines.filter((line) => line.startsWith("data:")).map((line) => line.slice(5).trimStart());
      if (!eventLine || dataLines.length === 0) return null;
      try {
        return { event: eventLine.slice(6).trim(), data: JSON.parse(dataLines.join("\n")) };
      } catch (error) {
        return null;
      }
    }

    questionInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        chatForm.requestSubmit();
      }
    });
    loginTab.addEventListener("click", () => setAuthMode("login"));
    registerTab.addEventListener("click", () => setAuthMode("register"));
    logoutButton.addEventListener("click", clearToken);
    refreshDocumentsButton.addEventListener("click", loadDocuments);
    knowledgeBaseIdInput.addEventListener("change", loadDocuments);
    loadMe();
  </script>
</body>
</html>
