<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RAG Agent</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8fa;
      --panel: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #d7dde5;
      --accent: #2563eb;
      --accent-dark: #1d4ed8;
      --ok: #0f766e;
      --warn: #b45309;
      --user: #e9f1ff;
      --agent: #f3f4f6;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .app {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      border-right: 1px solid var(--line);
      background: #eef2f7;
      padding: 24px;
    }

    .brand {
      margin: 0 0 24px;
      font-size: 24px;
      line-height: 1.2;
      font-weight: 700;
    }

    .status {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 16px;
    }

    .status-label {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 13px;
    }

    .status-value {
      margin: 0;
      font-size: 15px;
      line-height: 1.55;
    }

    .status-value.ready {
      color: var(--ok);
    }

    .status-value.pending {
      color: var(--warn);
    }

    .tips {
      margin-top: 24px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .main {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      min-width: 0;
      height: 100vh;
    }

    .topbar {
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      padding: 18px 24px;
    }

    .topbar h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.3;
    }

    .topbar p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .messages {
      overflow-y: auto;
      padding: 24px;
    }

    .message {
      max-width: 840px;
      margin-bottom: 14px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      line-height: 1.65;
      overflow-wrap: anywhere;
    }

    .message.user {
      margin-left: auto;
      background: var(--user);
      white-space: pre-wrap;
    }

    .message.agent {
      background: var(--agent);
    }

    .message.markdown p {
      margin: 0 0 10px;
    }

    .message.markdown p:last-child {
      margin-bottom: 0;
    }

    .message.markdown ul,
    .message.markdown ol {
      margin: 8px 0 8px 22px;
      padding: 0;
    }

    .message.markdown li {
      margin: 4px 0;
    }

    .message.markdown code {
      border-radius: 4px;
      background: rgba(15, 23, 42, 0.08);
      padding: 2px 5px;
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 0.92em;
    }

    .message.markdown pre {
      overflow-x: auto;
      border-radius: 8px;
      background: #111827;
      color: #f9fafb;
      padding: 12px;
      white-space: pre;
    }

    .message.markdown pre code {
      background: transparent;
      padding: 0;
      color: inherit;
    }

    .message.markdown table {
      width: 100%;
      border-collapse: collapse;
      margin: 10px 0;
      overflow-wrap: normal;
    }

    .message.markdown th,
    .message.markdown td {
      border: 1px solid var(--line);
      padding: 6px 8px;
      text-align: left;
      vertical-align: top;
    }

    .message.markdown mjx-container {
      overflow-x: auto;
      overflow-y: hidden;
      max-width: 100%;
    }

    .composer {
      border-top: 1px solid var(--line);
      background: var(--panel);
      padding: 16px 24px;
    }

    .composer-form {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 92px;
      gap: 12px;
      max-width: 980px;
      margin: 0 auto;
    }

    textarea {
      width: 100%;
      min-height: 48px;
      max-height: 160px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px 14px;
      color: var(--text);
      font: inherit;
      line-height: 1.5;
      outline: none;
    }

    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    button {
      height: 48px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: var(--accent-dark);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    @media (max-width: 760px) {
      .app {
        grid-template-columns: 1fr;
      }

      .sidebar {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .main {
        height: auto;
        min-height: 70vh;
      }

      .composer-form {
        grid-template-columns: 1fr;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <h2 class="brand">RAG Agent</h2>
      <section class="status" aria-live="polite">
        <p class="status-label">知识库状态</p>
        <p id="statusText" class="status-value pending">正在检查索引...</p>
      </section>
      <p class="tips">
        将 txt、pdf、docx 或 pptx 文件放入 data/ 后，先运行 python build_index.py 构建 Chroma 索引，再回到这里提问。
      </p>
    </aside>

    <main class="main">
      <header class="topbar">
        <h1>个人知识库问答</h1>
        <p>基于本地 Chroma 检索和智谱 AI 生成回答。</p>
      </header>

      <section id="messages" class="messages">
        <div class="message agent">你好，我已经准备好接收问题了。知识库未就绪时，我会提示你先构建索引。</div>
      </section>

      <footer class="composer">
        <form id="chatForm" class="composer-form">
          <textarea id="questionInput" placeholder="输入你的问题..." rows="2" autocomplete="off"></textarea>
          <button id="sendButton" type="submit">发送</button>
        </form>
      </footer>
    </main>
  </div>

  <script>
    window.MathJax = {
      tex: {
        inlineMath: [["$", "$"]],
        displayMath: [["$$", "$$"]],
        processEscapes: true,
      },
      options: {
        skipHtmlTags: ["script", "noscript", "style", "textarea", "pre", "code"],
      },
    };
  </script>
  <script defer src="{{ url_for('static', filename='vendor/purify.min.js') }}"></script>
  <script defer src="{{ url_for('static', filename='vendor/marked.umd.js') }}"></script>
  <script defer src="{{ url_for('static', filename='vendor/tex-mml-chtml.js') }}"></script>
  <script>
    const messages = document.querySelector("#messages");
    const form = document.querySelector("#chatForm");
    const input = document.querySelector("#questionInput");
    const button = document.querySelector("#sendButton");
    const statusText = document.querySelector("#statusText");
    const chatHistory = [];
    const maxHistoryMessages = 10;

    function appendMessage(role, text) {
      const node = document.createElement("div");
      node.className = `message ${role}`;
      if (role === "agent") {
        renderMarkdownMessage(node, text);
      } else {
        node.textContent = text;
      }
      messages.appendChild(node);
      messages.scrollTop = messages.scrollHeight;
    }

    function renderMarkdownMessage(node, text) {
      node.classList.add("markdown");

      if (!window.marked || !window.DOMPurify) {
        node.textContent = text;
        return;
      }

      const html = window.marked.parse(text, {
        breaks: true,
        gfm: true,
      });
      node.innerHTML = window.DOMPurify.sanitize(html);

      if (window.MathJax?.typesetPromise) {
        window.MathJax.typesetPromise([node]).catch(() => {});
      }
    }

    async function loadStatus() {
      if (window.location.protocol === "file:") {
        statusText.textContent = "请通过 http://127.0.0.1:5001 打开页面，直接打开 HTML 文件无法调用后端。";
        statusText.className = "status-value pending";
        return;
      }

      const response = await fetch("/api/status");
      const status = await response.json();
      statusText.textContent = status.message;
      statusText.className = `status-value ${status.ready ? "ready" : "pending"}`;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const question = input.value.trim();
      if (!question) {
        return;
      }
      if (window.location.protocol === "file:") {
        appendMessage("agent", "请先启动 Flask 服务，并访问 http://127.0.0.1:5001 后再提问。");
        return;
      }

      appendMessage("user", question);
      input.value = "";
      button.disabled = true;
      button.textContent = "生成中";

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            question,
            history: chatHistory.slice(-maxHistoryMessages),
          }),
        });
        const data = await response.json();
        const answer = data.answer || "没有返回内容。";
        appendMessage("agent", answer);
        chatHistory.push(
          { role: "user", content: question },
          { role: "assistant", content: answer },
        );
      } catch (error) {
        appendMessage("agent", "请求失败，请确认本地服务仍在运行。");
      } finally {
        button.disabled = false;
        button.textContent = "发送";
        input.focus();
      }
    });

    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });

    loadStatus();
  </script>
</body>
</html>
